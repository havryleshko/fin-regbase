# ─────────────────────────────────────────────────────────────────────────────
# FINANCIAL PROMOTIONS APPROVER REGIME (s.21 FSMA / FCA GATEWAY)
# ─────────────────────────────────────────────────────────────────────────────

- id: E029
  question: >
    What is the FCA financial promotions approver gateway, when did it come into
    force, and what does it require of authorised firms that approve financial
    promotions for unauthorised persons?
  difficulty: easy
  type: factual
  expected_pages:
    - financial-promotions-approver-regime
  required_facts:
    - "The FCA gateway requires authorised firms that approve financial promotions for unauthorised persons to first obtain specific FCA approval to perform that function"
    - "The gateway came into force on 7 January 2024 — firms already approving promotions were given a transitional period to apply"
    - "Under s.21 FSMA an unauthorised person may only communicate a financial promotion if it is approved by an FCA-authorised person — the gateway adds a second layer requiring the approver itself to be specifically authorised by the FCA to approve third-party promotions"
    - "An authorised firm that approves third-party promotions without gateway approval is itself in breach — and the unauthorised person communicating the promotion commits a criminal offence under s.25 FSMA"
  required_citations:
    - "FSMA 2000 s.21"
    - "COBS 4.10"
  notes_for_reviewer: >
    FSMA 2000 s.21 = financial promotion restriction. COBS 4.10 = FCA gateway
    obligations for s.21 approvers (4.10.2R: pre-approval, ongoing monitoring,
    quarterly attestation). FSMA s.21A does not appear in the wiki — no FSMA section
    of that number relates to financial promotions; only Terrorism Act 2000 s.21A
    (TF disclosure) exists. The gateway was implemented through FCA permission
    requirements and COBS 4.10. Date confirmed as 7 January 2024 in wiki (question
    says 7 Feb — verify against source).
  tags: [financial-promotions, approver, FCA-gateway, s21-FSMA, authorised-persons]

- id: M038
  question: >
    An authorised firm approves a financial promotion for an unauthorised fintech.
    The promotion is communicated. What ongoing obligations does the approver have
    after giving approval?
  difficulty: medium
  type: factual
  expected_pages:
    - financial-promotions-approver-regime
  required_facts:
    - "The approver must monitor the promotion on an ongoing basis — approval is not a one-off event discharged at the point of sign-off"
    - "If the promotion ceases to comply with FCA financial promotion rules after approval, the approver must withdraw approval and notify the unauthorised firm"
    - "On withdrawal of approval, the unauthorised firm must immediately withdraw the promotion — it becomes unlawful to communicate a promotion that no longer has a valid approval"
    - "The approver must keep records of all approvals, the basis for each approval, and any subsequent withdrawal — the firm takes on regulatory responsibility for the promotion's ongoing compliance"
  required_citations:
    - "FSMA 2000 s.21"
    - "COBS 4.10"
  notes_for_reviewer: >
    Ongoing monitoring and withdrawal obligation = COBS 4.10.2R (confirmed against
    wiki). Quarterly attestation requirement from unauthorised person = COBS 4.10.2R.
    Record keeping = COBS 4.11.1R. FSMA s.21A does not appear in the wiki — replaced
    with COBS 4.10 which is the FCA conduct rule implementing the gateway.
  tags: [financial-promotions, approver, monitoring, withdrawal, FCA-gateway]

- id: M039
  question: >
