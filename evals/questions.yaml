# ─────────────────────────────────────────────────────────────────────────────
# OPERATIONAL RESILIENCE — SYSC 15A
# ─────────────────────────────────────────────────────────────────────────────

- id: E030
  question: >
    What is an "important business service" under SYSC 15A, and what two
    dimensions must an impact tolerance address?
  difficulty: easy
  type: factual
  expected_pages:
    - operational-resilience
  required_facts:
    - "An important business service (IBS) is a service provided by a firm to an external end user whose disruption could cause intolerable harm to consumers or market integrity, or pose a risk to the firm's safety and soundness or financial stability"
    - "Firms must identify their own important business services — the FCA does not prescribe which services qualify; identification is the firm's responsibility based on impact assessment"
    - "An impact tolerance must address two dimensions: (1) the maximum tolerable duration of disruption — the longest the firm can be disrupted before harm becomes intolerable; and (2) the maximum tolerable level of disruption within that period, for example transaction volumes or data integrity thresholds"
    - "The deadline for all firms to be able to remain within their impact tolerances was 31 March 2025"
  required_citations:
    - "SYSC 15A.2.1R"
    - "SYSC 15A.2.5R"
  notes_for_reviewer: >
    SYSC 15A.2.1R = IBS identification obligation. SYSC 15A.2.5R = impact tolerance
    setting. Original SYSC 15A.4 is the mapping section — not relevant to this question.
    Confirmed against wiki/concepts/operational-resilience.md.
  tags: [SYSC, operational-resilience, important-business-service, impact-tolerance]

- id: M040
  question: >
    A firm has set an impact tolerance of 24 hours for its payment processing
    service. What ongoing SYSC 15A obligations does it have to test whether it
    can remain within that tolerance?
  difficulty: medium
  type: factual
  expected_pages:
    - operational-resilience
  required_facts:
    - "The firm must carry out scenario testing to assess its ability to remain within the 24-hour impact tolerance — testing must include severe but plausible disruption scenarios"
    - "Scenario testing must cover technology failures, cyber incidents, third-party failures, and physical access failures — scenarios must be tailored to the firm's specific vulnerabilities"
    - "The firm must learn lessons from testing and act on the findings — scenario testing is not a box-ticking exercise; the firm must improve resilience where testing reveals gaps"
    - "The firm must document its mapping of the people, processes, technology, facilities, and information that underpin the service — this mapping informs scenario design"
    - "Results of scenario testing must be reported to the firm's governing body"
  required_citations:
    - "SYSC 15A.5"
  notes_for_reviewer: >
    SYSC 15A.5.3R/5.4R = mandatory testing obligation. SYSC 15A.5.7R = three testing
    triggers. SYSC 15A.5.8R/5.9R = lessons learned and improvements. SYSC 15A.6 is
    self-assessment documentation — not scenario testing. Governing body approval is
    SYSC 15A.7.1R. Confirmed against wiki/concepts/operational-resilience.md.
  tags: [SYSC, operational-resilience, scenario-testing, impact-tolerance]

- id: M041
  question: >
    A firm's scenario testing reveals it cannot remain within its stated impact
    tolerance for its customer-facing mobile banking service. What must it do?
  difficulty: medium
  type: factual
  expected_pages:
    - operational-resilience
  required_facts:
    - "The firm must develop and implement a plan to remediate the gap — it must improve its resilience to the point where it can remain within its impact tolerance"
    - "The firm must notify the FCA that it has identified a gap between its current resilience and its stated impact tolerance"
    - "The firm must not simply lower its impact tolerance to match its actual (deficient) resilience — the tolerance must be set at the level that prevents intolerable harm, not at the level the firm currently achieves"
    - "Until the gap is remediated, the firm must maintain response and recovery capabilities to manage a disruption that exceeds the tolerance"
    - "Ongoing testing must continue while the remediation plan is in progress to monitor whether resilience is improving"
  required_citations:
    - "SYSC 15A.2.11G"
  notes_for_reviewer: >
    SYSC 15A.2.11G = Principle 11 notification trigger for any failure to meet an
    impact tolerance (no materiality threshold). SYSC 15A.6.6R does not exist — SYSC
    15A.6 only has 15A.6.1R and 15A.6.2R. Confirmed against wiki/concepts/operational-resilience.md
    and wiki/summaries/sysc15a-operational-resilience.md.
  tags: [SYSC, operational-resilience, impact-tolerance, FCA-notification, remediation]

- id: H031
  question: >
    A firm has identified its important business services and set impact tolerances,
    but has not mapped the people, processes, technology, facilities, and information
    underpinning each service. It argues the mapping is optional. Is this correct?
  difficulty: hard
  type: edge-case
  expected_pages:
    - operational-resilience
  required_facts:
    - "No — the mapping is a mandatory SYSC 15A requirement, not optional"
    - "Firms must map the people, processes, technology, facilities, and information (PPTI+F) that support each important business service — this mapping is what enables meaningful scenario testing and credible impact tolerance figures"
    - "Without mapping, a firm cannot identify dependencies and vulnerabilities of its IBS — its impact tolerance figures are not evidence-based and its scenario testing is not credible"
    - "The FCA expects firms to have completed initial mapping as part of their self-assessment — mapping is the foundation of the SYSC 15A framework, not an optional enhancement"
    - "Failure to complete mapping is a breach of SYSC 15A even if the firm has produced other elements of an operational resilience framework"
  required_citations:
    - "SYSC 15A.4"
  notes_for_reviewer: >
    SYSC 15A.4.1R = mapping obligation (five asset categories: people, processes,
    technology, facilities, information). SYSC 15A.5 is scenario testing — not
    mapping. Confirmed against wiki/concepts/operational-resilience.md.
  tags: [SYSC, operational-resilience, mapping, PPTI, self-assessment]

- id: H032
  question: >
    A firm outsources its core payment processing to a major cloud provider and
    argues that because the provider is large and well-resourced with its own
    resilience programme, it does not need to include the provider in its
    operational resilience mapping or scenario testing. Is this correct?
  difficulty: hard
  type: edge-case
  expected_pages:
    - operational-resilience
  required_facts:
    - "No — SYSC 15A applies to the firm regardless of who provides its underlying infrastructure"
    - "Third-party dependencies — including cloud providers — must be included in the firm's mapping of the people, processes, technology, facilities, and information supporting each important business service"
    - "The firm remains fully responsible for the resilience of its important business services even where those services rely on outsourced infrastructure"
    - "Scenario testing must include scenarios involving third-party failure — including cloud provider outages — even if the provider is well-resourced"
    - "The firm cannot outsource its SYSC 15A obligations — it must have its own impact tolerance, its own testing, and its own response plan for third-party failures"
  required_citations:
    - "SYSC 15A.4"
    - "SYSC 15A.5"
  notes_for_reviewer: >
    SYSC 15A.4.1R = mapping (must include third-party resources per 15A.4.2G).
    SYSC 15A.5.3R/5.7R = scenario testing (must include third-party failure scenarios).
    SYSC 15A.6 is self-assessment docs — not relevant here. Confirmed against wiki.
  tags: [SYSC, operational-resilience, outsourcing, cloud, third-party]

# ─────────────────────────────────────────────────────────────────────────────
# UK GDPR — ACCOUNTABILITY LAYER (DPIA, DPO, BREACH NOTIFICATION, PROCESSORS)
# ─────────────────────────────────────────────────────────────────────────────

- id: E031
  question: >
    Under UK GDPR Article 37, what three categories of processing make
    appointment of a Data Protection Officer mandatory?
  difficulty: easy
  type: factual
  expected_pages:
    - uk-gdpr-dpo
  required_facts:
    - "Processing carried out by a public authority or public body (other than courts acting in a judicial capacity)"
    - "Core activities that consist of processing operations which by their nature, scope or purposes require regular and systematic monitoring of data subjects on a large scale"
    - "Core activities that consist of processing on a large scale of special categories of data under Article 9 or personal data relating to criminal convictions and offences under Article 10"
    - "'Core activities' means the primary business activities — a DPO is not mandatory where data processing is merely an ancillary support function even if it is large-scale"
    - "Organisations not subject to mandatory DPO appointment may appoint one voluntarily — but the same statutory obligations then apply as for mandatory DPOs"
  required_citations:
    - "UK GDPR Art. 37(1)"
  tags: [UK-GDPR, DPO, accountability, mandatory-appointment]

- id: M042
  question: >
    A fintech firm is launching an AI-based credit scoring system that will
    process financial and behavioural data on millions of customers to produce
    automated credit decisions. Must it conduct a DPIA before launch?
  difficulty: medium
  type: synthesis
  expected_pages:
    - uk-gdpr-dpia
    - uk-gdpr-automated-decision-making
  required_facts:
    - "Yes — a DPIA is mandatory before launch"
    - "Article 35(3)(a) requires a DPIA for systematic and extensive evaluation of personal aspects of natural persons based on automated processing including profiling, which produces decisions that significantly affect natural persons — automated credit scoring is the paradigm case"
    - "Large-scale processing is a separate mandatory DPIA trigger — processing data on millions of customers satisfies this threshold regardless of the automated decision-making element"
    - "The DPIA must assess: the nature, scope, context and purposes of the processing; necessity and proportionality; risks to rights and freedoms; and measures to address those risks"
    - "If the DPIA concludes that residual risks remain high after mitigation measures, the firm must consult the ICO before proceeding — it cannot launch until the ICO has responded or 8 weeks have passed"
  required_citations:
    - "UK GDPR Art. 35(3)(a)"
    - "UK GDPR Art. 36"
  tags: [UK-GDPR, DPIA, automated-decision-making, credit-scoring, fintech]

- id: M043
  question: >
    What are the minimum mandatory terms a controller must include in a processor
    contract under UK GDPR Article 28?
  difficulty: medium
  type: factual
  expected_pages:
    - uk-gdpr-processor-contracts
  required_facts:
    - "The processor must process personal data only on documented instructions from the controller"
    - "The processor must ensure that persons authorised to process the data are subject to a duty of confidentiality"
    - "The processor must implement appropriate technical and organisational security measures under Article 32"
    - "The processor must not engage a sub-processor without prior written authorisation from the controller (specific or general)"
    - "The processor must assist the controller in responding to data subject rights requests"
    - "The processor must assist the controller with its security, breach notification, DPIA, and prior consultation obligations"
    - "On termination, the processor must delete or return all personal data to the controller"
    - "The processor must make available all information necessary to demonstrate compliance and allow audits"
  required_citations:
    - "UK GDPR Art. 28(3)"
  tags: [UK-GDPR, processor-contracts, Article-28, mandatory-terms, accountability]

- id: M044
  question: >
    A processor suffers a personal data breach affecting personal data it
    processes on behalf of a controller. What must the processor do and within
    what timeframe?
  difficulty: medium
  type: factual
  expected_pages:
    - uk-gdpr-personal-data-breaches
    - uk-gdpr-processor-contracts
  required_facts:
    - "The processor must notify the controller without undue delay after becoming aware of the breach"
    - "There is no fixed statutory timeframe imposed on the processor's notification to the controller — 'without undue delay' means as quickly as possible in the circumstances"
    - "The processor is not required to notify the ICO directly — that obligation rests with the controller"
    - "The 72-hour clock for ICO notification applies to the controller — it typically starts when the controller becomes aware of the breach, which is usually when the processor notifies them"
    - "The processor must provide sufficient information to enable the controller to comply with its notification obligations — including the nature of the breach, categories of data affected, and measures taken or proposed"
  required_citations:
    - "UK GDPR Art. 33(2)"
    - "UK GDPR Art. 33(1)"
  tags: [UK-GDPR, personal-data-breaches, processor, controller, breach-notification]

- id: H033
  question: >
    A firm conducts a DPIA for a new biometric access control system processing
    employees' fingerprints. The DPIA concludes that residual risks to employee
    rights and freedoms remain high even after all proposed mitigation measures.
    What must the firm do before deploying the system?
  difficulty: hard
  type: factual
  expected_pages:
    - uk-gdpr-dpia
  required_facts:
    - "Where a DPIA concludes that residual risks remain high despite mitigation measures, the firm must consult the ICO before proceeding — this is mandatory prior consultation under Article 36"
    - "The firm must submit the DPIA to the ICO along with a description of the processing, the purposes, the measures proposed, the data controller's details, and the DPO's details if applicable"
    - "The ICO has up to 8 weeks to respond (extendable by a further 6 weeks in complex cases) — the firm must not deploy the system until the ICO has responded or the consultation period has expired"
    - "If the ICO considers the processing would infringe the UK GDPR, it must provide written advice and may restrict or prohibit the processing"
    - "Biometric data is special category data under Article 9 — the DPIA must also identify a valid Article 9 condition for processing in addition to an Article 6 lawful basis"
  required_citations:
    - "UK GDPR Art. 36"
    - "UK GDPR Art. 9"
  tags: [UK-GDPR, DPIA, prior-consultation, ICO, biometric, special-category]

- id: H034
  question: >
    A firm with 200 employees processes occupational health data about its staff
    as part of a systematic health monitoring programme. Must it maintain a Record
    of Processing Activities under UK GDPR Article 30?
  difficulty: hard
  type: edge-case
  expected_pages:
    - uk-gdpr-records-of-processing
  required_facts:
    - "Yes — the firm must maintain a RoPA despite having fewer than 250 employees"
    - "Article 30(5) provides an exemption from the RoPA obligation for organisations with fewer than 250 employees, but the exemption does not apply where the processing is likely to result in a risk to data subjects' rights and freedoms, where processing is not occasional, or where processing includes special categories under Article 9"
    - "Occupational health data is health data — a special category under Article 9 — which disapplies the small-organisation exemption entirely"
    - "The exemption also fails on the 'not occasional' ground — a systematic health monitoring programme is regular, ongoing processing"
    - "In practice the Article 30(5) exemption is very narrow — most organisations that process any special category data or carry out regular processing must maintain a RoPA regardless of size"
  required_citations:
    - "UK GDPR Art. 30(1)"
    - "UK GDPR Art. 30(5)"
  tags: [UK-GDPR, RoPA, records-of-processing, Article-30, special-category, small-organisations]
