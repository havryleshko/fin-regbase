    - "The receiving PSP must contribute 50% of the reimbursement amount to the sending PSP — the cost is shared equally between them"
    - "The 50/50 split is a default allocation and does not depend on which PSP was at greater fault"
    - "The receiving PSP's obligation to contribute arises only after the sending PSP has reimbursed the consumer — the consumer always deals with the sending PSP"
    - "Both PSPs must maintain systems to identify inbound mule accounts — the receiving PSP's contribution obligation is designed to incentivise detection of fraudulent recipient accounts"
