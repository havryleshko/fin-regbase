    - "A generic warning displayed to all customers does not satisfy the higher duty of care owed to a vulnerable consumer"
    - "The PSP bears the burden of demonstrating gross negligence — for vulnerable consumers the bar is higher because their vulnerability may have been exploited by the fraudster"
    - "If the PSP failed to take appropriate steps given its knowledge of the vulnerability, it cannot rely on the consumer's failure to heed a warning it knew was insufficient"
  required_citations:
    - "PSR PS23/3"
  tags: [APP-fraud, PSR, vulnerable-consumers, reimbursement, fraud-warning, PS23-3]

- id: H028
  question: >
