    - "The gateway applies only where an authorised firm approves a promotion for an unauthorised third party under s.21 FSMA"
    - "Appointed representatives communicating promotions that fall within the scope of their principal's business also do not require gateway approval — the principal's authorisation covers the representative's promotions within that scope"
    - "The gateway is specifically targeted at the s.21 approver function — the market of authorised firms providing approval services to unauthorised businesses"
  required_citations:
    - "COBS 4.10"
  notes_for_reviewer: >
    Scope of gateway (applies to s.21 approvals for unauthorised third parties only,
    not own promotions or AR promotions within principal scope) = COBS 4.10. FSMA s.21A
    does not appear in the wiki.
  tags: [financial-promotions, approver, FCA-gateway, scope, own-promotions]

