    - "The warning must have been specific to the payee or the transaction — generic fraud awareness messages do not satisfy this requirement"
    - "The consumer is assessed against the standard of a reasonably careful person — if such a person would have heeded the warning, ignoring it constitutes contributory behaviour"
    - "If the consumer is vulnerable, a higher standard of care applies — ignoring a warning may not reduce reimbursement for a vulnerable consumer who lacked capacity to understand it"
