  required_facts:
    - "An automated credit refusal with legal or similarly significant effects on the customer falls within Article 22 — the ICO has named automatic credit refusal as a 'similarly significant effect'"
    - "The firm must have a permitted ground for the automated decision: (1) necessary for entering or performing a contract; (2) authorised by law; or (3) explicit consent of the data subject"
    - "A credit application is typically ground (1) — necessary for entering into a contract — which is the most commonly used ground for automated credit decisions"
    - "The firm must implement suitable safeguards including: the right to obtain human review of the decision; the right to express the data subject's point of view; and the right to contest the decision"
    - "Where special category data (e.g. health data relevant to the application) is involved in the automated decision, the permitted grounds are narrower — only explicit consent or substantial public interest apply"
