- id: E024
  question: >
    Where must a firm hold client money under CASS 7, what type of account is
    required, and what specific acknowledgement must the firm obtain from the bank?
  difficulty: easy
  type: factual
  expected_pages:
    - client-money-framework
  required_facts:
    - "Client money must be held in a client bank account — an account held in the name of the firm but designated as a client account, separate from the firm's own money"
    - "The account must be held at an approved bank — a credit institution authorised by the PRA, or a bank authorised in an EEA state or qualifying third country"
    - "The firm must obtain a written acknowledgement from the bank confirming that: the money is held as client money, the bank cannot exercise any right of set-off against client money for debts owed by the firm, and the bank is aware the money belongs to clients"
    - "The acknowledgement letter is a hard condition — without it, the client bank account cannot be treated as properly segregated under CASS 7"
  required_citations:
    - "CASS 7.13.3R"
    - "CASS 7.18.2R"
  tags: [CASS, client-money, segregation, client-bank-account]

- id: E025
  question: >
    What is a CASS resolution pack and within what timeframe must a firm be
    able to produce it?
  difficulty: easy
  type: factual
  expected_pages:
    - cass10-resolution-pack
  required_facts:
    - "A CASS resolution pack is a set of documents and records enabling rapid identification, return, or transfer of client money and custody assets in the event of the firm's insolvency"
    - "It must contain sufficient information to allow a third party — such as an insolvency practitioner — to identify and return client assets without relying on the firm's staff"
    - "The firm must be able to retrieve each document in the resolution pack within 48 hours — whether from an FCA or Bank of England request, or for an insolvency officer (administrator, receiver, trustee, or liquidator) appointed in respect of the firm"
    - "The resolution pack obligation applies to all CASS-regulated firms — it is not limited to large firms or those with complex client asset arrangements"
  required_citations:
    - "CASS 10.1.7R"
  tags: [CASS, resolution-pack, client-money, custody, insolvency]

- id: M032
  question: >
    Under what conditions may a firm apply the institutional client money
    opt-out under CASS 7, and what is the effect of doing so?
  difficulty: medium
  type: factual
  expected_pages:
    - client-money-framework
  required_facts:
    - "The institutional client money opt-out is available for eligible counterparties and certain professional clients — retail clients cannot opt out of client money protection"
    - "The opt-out requires a written agreement signed by the client clearly stating the effect: the client's money will not be subject to CASS 7 protection and will be treated as the firm's own money"
    - "Once opted out, the money loses its statutory trust status — in the firm's insolvency, the client becomes an unsecured creditor for that money rather than a beneficiary of the client money trust"
    - "The firm must disclose clearly that opting out removes insolvency protection before obtaining the client's agreement"
  required_citations:
    - "CASS 7.10.10R"
  notes_for_reviewer: >
    CASS 7.10.10R = professional client opt-out (confirmed against wiki). Available to
    professional clients and eligible counterparties; not available to retail clients.
    Written acknowledgement required.
    Confirm the CASS 7.10 sub-rule number.
  tags: [CASS, client-money, institutional-opt-out, professional-clients, insolvency]

- id: M033
  question: >
    A firm discovers a shortfall in its client money account — the aggregate
    client money balance is less than what it owes to clients. What must it
    do immediately?
  difficulty: medium
  type: factual
  expected_pages:
    - client-money-framework
  required_facts:
    - "The firm must immediately pay its own money into the client bank account to make good the shortfall — it cannot leave the shortfall unremedied even temporarily"
    - "The firm must investigate the cause of the shortfall and correct any error in its reconciliation records"
    - "If the firm cannot immediately make good the shortfall from its own resources, it must notify the FCA"
    - "The shortfall must be recorded in the firm's reconciliation records — the firm cannot simply adjust records without addressing the underlying shortfall"
    - "A persistent or unrecoverable shortfall is a significant CASS event that must be reported to the FCA"
  required_citations:
    - "CASS 7.15.29R"
  notes_for_reviewer: >
    Verify the exact CASS rule requiring immediate top-up of a client money shortfall
    (may be CASS 7.15.29R or similar) and confirm the FCA notification obligation for
    shortfalls the firm cannot immediately remedy. The significant CASS event reporting
    trigger should be verified against the wiki.
  tags: [CASS, client-money, shortfall, reconciliation, FCA-notification]

- id: H023
  question: >
    A retail client enters into a title transfer collateral arrangement (TTCA)
    with their broker as part of a margin trading account. What happens to CASS
    protections for the assets transferred under the arrangement?
  difficulty: hard
  type: edge-case
  expected_pages:
    - cass6-custody-rules
  required_facts:
    - "A firm must not enter into a TTCA with a retail client in relation to assets that would otherwise be safe custody assets — the prohibition is absolute under CASS 6.1.6R"
    - "Because the TTCA is prohibited, it has no legal effect under CASS — the assets remain safe custody assets and CASS 6 custody protections continue to apply"
    - "The firm cannot use disclosure or consent to sidestep the retail TTCA ban — there is no waiver or exemption available for retail clients"
    - "For non-retail clients, a TTCA is permitted only if the arrangement is documented, proportionality is assessed, and risks are disclosed — but none of these conditions apply to retail clients"
    - "In contrast to non-retail TTCAs (where title transfers and the client becomes an unsecured creditor), a purported retail TTCA leaves the client's proprietary rights under CASS 6 intact"
  required_citations:
    - "CASS 6.1.6R"
  tags: [CASS, custody, title-transfer, collateral, TTCA, retail-clients]

- id: H024
  question: >
    A firm appoints a sub-custodian in a non-EEA jurisdiction to hold client
    custody assets. The legal framework in that jurisdiction does not require
    client assets to be separately identified from the sub-custodian's own assets.
    What must the firm do before proceeding?
  difficulty: hard
  type: edge-case
  expected_pages:
    - cass6-custody-rules
  required_facts:
    - "A firm must only deposit client assets with a third party in a jurisdiction that specifically regulates and supervises the safekeeping of assets for another person — and the third party must be subject to that regulation"
    - "Depositing in a jurisdiction that does not specifically regulate safekeeping is prohibited unless: (a) the nature of the asset or investment service requires it; or (b) for professional clients only, the client requests in writing that assets be deposited there"
    - "The firm must take necessary steps to ensure assets deposited with the sub-custodian are identifiable separately from both the firm's own assets and the sub-custodian's own assets"
    - "The firm remains responsible for exercising all due skill, care and diligence in the selection, appointment and periodic monitoring of the sub-custodian regardless of jurisdiction"
  required_citations:
    - "CASS 6.3.4R"
    - "CASS 6.3.1R"
  notes_for_reviewer: >
    CASS 6.3.4R = jurisdiction restriction (confirmed against wiki). CASS 6.3.1R = due diligence
    in selection and monitoring. Original citation CASS 6.3.3R does not appear in wiki or sources.
  tags: [CASS, custody, sub-custodian, non-EEA, asset-segregation]

# ─────────────────────────────────────────────────────────────────────────────
# COBS — INDUCEMENTS AND RESEARCH UNBUNDLING (COBS 2.3A / 2.3B)
# ─────────────────────────────────────────────────────────────────────────────

- id: E026
  question: >
    What conditions must a third-party benefit meet to qualify as a permitted
    minor non-monetary benefit (MNMB) under COBS 2.3A?
  difficulty: easy
  type: factual
  expected_pages:
    - inducements-framework
  required_facts:
    - "The benefit must be reasonable and proportionate in scale — it must not be so significant as to risk impairing the firm's obligation to act in the client's best interest"
    - "The benefit must enhance the quality of service provided to the client — there must be a clear connection between the benefit and what the client receives"
    - "The benefit must not impair compliance with the firm's duty to act honestly, fairly and professionally in the client's best interest"
    - "MNMBs include: participation in training and conferences, hospitality of a reasonable value, minor gifts, and research that is widely available to the general public"
    - "All non-monetary benefits received must be disclosed to the client at least annually in summary form"
  required_citations:
    - "COBS 2.3A.19R"
  tags: [COBS, inducements, MNMB, third-party-payments, MiFID]

- id: M034
  question: >
    An investment firm wishes to use a research payment account (RPA) to pay
    for third-party research. What conditions must be satisfied before an RPA
    can be used?
  difficulty: medium
  type: factual
  expected_pages:
    - research-unbundling
    - inducements-framework
  required_facts:
    - "The RPA must be funded by a specific research charge to the client — a separate, transparent charge distinct from the execution commission"
    - "The firm must set and regularly assess a research budget for the amount it expects to spend on third-party research — the budget must be agreed at least annually"
    - "The firm must obtain prior consent from clients to use an RPA before it begins doing so — clients must be informed of the budgeted amount and the basis for the charge"
    - "The firm must regularly assess the quality of research purchased to ensure it contributes to better investment decisions"
    - "The RPA must be operated separately from the execution account — the firm must demonstrate that research payments come from the RPA, not from execution commissions"
  required_citations:
    - "COBS 2.3B.4R"
  notes_for_reviewer: >
    COBS 2.3B.4R = RPA conditions: volume/value de-linkage (4R(1)(b)), budget setting,
    quality assessment (4R(4)). COBS 2.3B.25R is joint payments conditions — different
    route. Confirmed against wiki/concepts/research-unbundling.md and
    wiki/summaries/cobs2-conduct-of-business.md.
  tags: [COBS, research, RPA, research-payment-account, unbundling]

- id: M035
  question: >
    A broker provides a bundled service combining trade execution and investment
    research. The investment firm receiving the service wishes to continue
    receiving both. What must it do to remain compliant with COBS 2.3B?
  difficulty: medium
  type: synthesis
  expected_pages:
    - research-unbundling
    - inducements-framework
  required_facts:
    - "The firm must unbundle the research from the execution — it must not pay for research through execution commissions"
    - "The firm has two compliant options: pay for research from its own profit and loss (P&L funding), or use an RPA funded by a separate client charge"
    - "Continuing to receive bundled research-and-execution payments without unbundling breaches COBS 2.3B"
    - "A breach of the research unbundling obligation is also a breach of the inducements rules under COBS 2.3A — the bundled payment impairs the firm's duty to act in the client's best interest"
    - "Under COBS 2.3A.7E, a breach of the inducements rules is automatically a breach of the client's best interests rule under COBS 2.1.1R — no separate analysis is required"
  required_citations:
