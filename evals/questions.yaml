    - "If the authorised firm approves without gateway approval, it commits a breach of COBS 4.10 — and the unauthorised firm communicating the promotion commits a criminal offence under s.25 FSMA"
    - "The unauthorised cryptoasset firm must seek approval only from a gateway-approved firm that is also specifically approved for cryptoasset promotions — the pool of eligible approvers is deliberately narrow"
